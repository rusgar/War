name: CI Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar todos los tests
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Verificar cobertura del modulo de la rama (>= 80%)
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys, os

          BRANCH_MODULE = {
              "feature/pipeline":        ["data_loader", "logger", "stats"],
              "feature/visualization":   ["charts"],
              "feature/ui":              ["filters", "kpis"],
          }

          branch = os.environ.get("GITHUB_REF_NAME", "")
          modules = BRANCH_MODULE.get(branch, [])

          if not modules:
              print(f"Rama '{branch}' no requiere check de cobertura especifico.")
              sys.exit(0)

          tree = ET.parse("coverage.xml")
          failed = False
          for cls in tree.iter("class"):
              filename = cls.get("filename", "")
              for mod in modules:
                  if mod in filename:
                      cov = float(cls.get("line-rate", 0)) * 100
                      status = "OK" if cov >= 80 else "FALLO"
                      print(f"[{status}] {filename}: {cov:.1f}%")
                      if cov < 80:
                          failed = True

          if failed:
              print("\nCobertura insuficiente. Minimo requerido: 80%")
              sys.exit(1)
          else:
              print("\nCobertura OK en todos los modulos de la rama.")
          PYEOF

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml

  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/ app.py
