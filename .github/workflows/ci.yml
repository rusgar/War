name: CrisisScope War Analytics CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # Usa una versión estable por ahora

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/ app.py

  test:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]  # Añadirás 3.13, 3.14 después

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar tests (solo test_charts.py por ahora)
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Verificar cobertura para feature/ui
        if: matrix.python-version == '3.12' && github.ref_name == 'feature/ui'
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys, os

          # Módulos específicos para feature/ui
          BRANCH_MODULE = {
              "feature/ui": ["charts", "filters", "kpis"],  # Añadido "charts"
          }

          branch = os.environ.get("GITHUB_REF_NAME", "")
          modules = BRANCH_MODULE.get(branch, [])

          if not modules:
              print(f"Rama '{branch}' no requiere check de cobertura especifico.")
              sys.exit(0)

          if not os.path.exists("coverage.xml"):
              print("Error: No se encontró coverage.xml")
              sys.exit(1)

          tree = ET.parse("coverage.xml")
          failed = False
          found_modules = False
          
          for cls in tree.iter("class"):
              filename = cls.get("filename", "")
              for mod in modules:
                  if mod in filename.lower():  # Búsqueda case-insensitive
                      found_modules = True
                      cov = float(cls.get("line-rate", 0)) * 100
                      status = "OK" if cov >= 80 else "FALLO"
                      print(f"[{status}] {filename}: {cov:.1f}%")
                      if cov < 80:
                          failed = True

          if not found_modules:
              print(f"⚠️  No se encontraron módulos: {modules}")
              print("Revisa que los archivos existan en src/")
              sys.exit(0)  # No falla, solo avisa

          if failed:
              print("\n❌ Cobertura insuficiente. Mínimo requerido: 80%")
              sys.exit(1)
          else:
              print("\n✅ Cobertura OK en todos los módulos de feature/ui")
          PYEOF

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false  # No falla si hay error con Codecov