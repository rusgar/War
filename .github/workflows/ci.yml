name: CrisisScope War Analytics CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Linting (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }} 

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/ app.py

  test:
    name: Tests & Coverage (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar todos los tests con Cobertura
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Verificar cobertura del modulo de la rama (>= 80%)
        # Solo ejecutamos el check de cobertura estricto en una versión de la matrix para evitar redundancia
        if: matrix.python-version == '3.12'
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys, os

          BRANCH_MODULE = {
              "feature/ui":            ["filters", "kpis"],
          }

          branch = os.environ.get("GITHUB_REF_NAME", "")
          modules = BRANCH_MODULE.get(branch, [])

          if not modules:
              print(f"Rama '{branch}' no requiere check de cobertura especifico.")
              sys.exit(0)

          if not os.path.exists("coverage.xml"):
              print("Error: No se encontró coverage.xml")
              sys.exit(1)

          tree = ET.parse("coverage.xml")
          failed = False
          for cls in tree.iter("class"):
              filename = cls.get("filename", "")
              for mod in modules:
                  if mod in filename:
                      cov = float(cls.get("line-rate", 0)) * 100
                      status = "OK" if cov >= 80 else "FALLO"
                      print(f"[{status}] {filename}: {cov:.1f}%")
                      if cov < 80:
                          failed = True

          if failed:
              print("\nCobertura insuficiente. Minimo requerido: 80%")
              sys.exit(1)
          else:
              print("\nCobertura OK en todos los modulos de la rama.")
          PYEOF

      - name: Subir reporte de cobertura
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }} # Recomendado para repositorios privados/consistencia